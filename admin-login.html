<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body" style="background: linear-gradient(135deg, #1e3c72, #2a5298);">

    <div class="login-container">
        <h2 style="color: #1e3c72;">⚙️ Admin Portal Login</h2>
        <p>Access for Faculty & Event Administrators</p>

        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
            <div class="input-group">
                <label for="adminUsername">Admin Username</label>
                <input type="text" id="adminUsername" placeholder="Enter admin username" required>
            </div>

            <div class="input-group">
                <label for="adminPassword">Admin Password</label>
                <input type="password" id="adminPassword" placeholder="Enter admin password" required>
            </div>

            <button type="submit" class="login-btn" style="background: linear-gradient(135deg, #1e3c72, #2a5298);">Admin Login</button>
        </form>

        <div class="back-link">
            <p style="margin-top: 15px; font-size: 13px;">
                <a href="index.html">← Back to Student Login</a>
            </p>
        </div>
    </div>

    <script src="admin-script.js"></script>
</body>
</html>
